<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Local Analytics - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-dark: #0f141c;
    --bg-card: #18202c;
    --bg-card-hover: #1e293b;
    --accent: #f59e0b;
    --accent-blue: #38bdf8;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --green: #10b981;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 1.6rem; color: var(--accent); letter-spacing: 0.5px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid #334155; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .tab-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); }
  .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .sub-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; background: #131a24; padding: 14px 18px; border-radius: 8px; border: 1px solid #263142; }
  .winner-banner { margin-top: 6px; padding: 6px 12px; background: rgba(16, 185, 129, 0.15); border-left: 4px solid var(--green); color: #a7f3d0; font-weight: 600; font-size: 0.92rem; border-radius: 4px; display: inline-block; }
  .awards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .award-card { background: linear-gradient(145deg, #18202c, #131923); border: 1px solid #2e3c50; border-radius: 10px; padding: 14px; position: relative; overflow: hidden; }
  .award-card.skill { border-top: 3px solid var(--green); }
  .award-card.blunder { border-top: 3px solid var(--red); }
  .award-card.epic { border: 1px solid var(--accent); background: linear-gradient(145deg, #272015, #181510); }
  .award-card h4 { font-size: 0.8rem; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .award-card.skill h4 { color: #34d399; }
  .award-card.blunder h4 { color: #f87171; }
  .award-card .winner { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .award-card .desc { font-size: 0.84rem; color: var(--text-muted); }
  .section-title { font-size: 1.15rem; margin: 24px 0 12px; color: var(--accent-blue); border-left: 4px solid var(--accent-blue); padding-left: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .table-wrap { overflow-x: auto; background: var(--bg-card); border-radius: 10px; border: 1px solid #283548; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: center; }
  th, td { padding: 10px 10px; border-bottom: 1px solid #232f40; white-space: nowrap; }
  th { background: #131a24; color: var(--text-muted); font-weight: 600; cursor: pointer; user-select: none; }
  th:hover { color: #fff; background: #1c2636; }
  td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: inherit; font-weight: 600; }
  tr:nth-child(even) { background: #151d28; }
  tr:hover { background: #202c3d; }
  .badge-bot { background: #475569; color: #cbd5e1; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  .good { color: var(--green); font-weight: 700; }
  .bad { color: var(--red); font-weight: 700; }
  .highlight { color: var(--accent); font-weight: 700; }
  .duels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .duel-card { background: var(--bg-card); border: 1px solid #283548; border-radius: 10px; padding: 14px; }
  .duel-card h3 { font-size: 1.05rem; margin-bottom: 8px; color: #fff; border-bottom: 1px solid #283548; padding-bottom: 6px; }
  .duel-meta { background: #131a24; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.82rem; line-height: 1.5; border: 1px solid #232f40; }
  .duel-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.85rem; border-bottom: 1px dashed #232f40; }
  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .chart-card { background: var(--bg-card); border: 1px solid #283548; border-radius: 10px; padding: 16px; }
  .chart-card h3 { font-size: 0.98rem; color: #fff; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .chart-box { position: relative; height: 320px; width: 100%; }
  .chart-box.tall { height: 380px; }
  .mini-btn { background: #131a24; color: var(--text-muted); border: 1px solid #334155; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: 600; }
  .mini-btn.active { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }
  .toggle-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; color: var(--text-muted); }
</style>
</head>

let currentTab = 'global';
let currentMapIdx = -1;
let sortCol = 'rating';
let sortAsc = false;
let timelineMetric = 'rating';
let activeCharts = [];

// Paleta de altísimo contraste (colores muy distintos entre sí) y asignación fija por jugador
const HIGH_CONTRAST_COLORS = [
  '#ff3b30', // Rojo vivo
  '#00d2ff', // Cian eléctrico
  '#34c759', // Verde esmeralda
  '#ffcc00', // Amarillo oro
  '#af52de', // Morado/Magenta brillante
  '#ff9500', // Naranja intenso
  '#00ff99', // Menta neón
  '#ff2d55', // Rosa fuerte
  '#5856d6', // Índigo
  '#ffffff'  // Blanco puro
];

const PLAYER_COLOR_MAP = {};
function getPlayerColor(name) {
  if (!PLAYER_COLOR_MAP[name]) {
    const idx = Object.keys(PLAYER_COLOR_MAP).length;
    PLAYER_COLOR_MAP[name] = HIGH_CONTRAST_COLORS[idx % HIGH_CONTRAST_COLORS.length];
  }
  return PLAYER_COLOR_MAP[name];
}

function plural(n, singular, pluralText) {
  return n === 1 ? `${n} ${singular}` : `${n} ${pluralText}`;
}

function getTiedTop(rows, prop, minVal = 1) {
  if (!rows.length) return null;
  const maxV = Math.max(...rows.map(r => r[prop]));
  if (maxV < minVal) return null;
  const winners = rows.filter(r => r[prop] === maxV);
  return { names: winners.map(w => w.name).join(' / '), val: maxV, sample: winners[0], all: winners };
}

function getTiedMin(rows, prop, maxAllowed = Infinity) {
  if (!rows.length) return null;
  const valid = rows.filter(r => r[prop] <= maxAllowed);
  if (!valid.length) return null;
  const minV = Math.min(...valid.map(r => r[prop]));
  const winners = valid.filter(r => r[prop] === minV);
  return { names: winners.map(w => w.name).join(' / '), val: minV, sample: winners[0], all: winners };
}

function init() {
  // Asignar colores fijos por orden alfabético de jugadores humanos globales
  const allHumans = DATA.global.stats.filter(p => !p.is_bot).map(p => p.name).sort();
  allHumans.forEach(n => getPlayerColor(n));

  const tabsEl = document.getElementById('mainTabs');
  let html = `<button class="tab-btn active" onclick="selectTab('global')">🏆 HISTÓRICO GLOBAL</button>`;
  for (const nid of Object.keys(DATA.nights)) {
    html += `<button class="tab-btn" id="tab_${nid}" onclick="selectTab('${nid}')">🌙 Noche ${nid}</button>`;
  }
  tabsEl.innerHTML = html;
  renderCurrentView();
}

function selectTab(tabId) {
  currentTab = tabId;
  currentMapIdx = -1;
  document.querySelectorAll('#mainTabs .tab-btn').forEach(b => b.classList.remove('active'));
  if (tabId === 'global') {
    document.querySelector('#mainTabs .tab-btn').classList.add('active');
  } else {
    document.getElementById('tab_' + tabId).classList.add('active');
  }
  renderCurrentView();
}

function selectMap(idx) {
  currentMapIdx = idx;
  renderCurrentView();
}

function setTimelineMetric(m) {
  timelineMetric = m;
  renderCurrentView();
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = false; }
  renderCurrentView();
}

function getActiveStatsObj() {

    const rTxt = plural(DATA.global.rounds_count, 'ronda total', 'rondas totales');

      isGlobal: true,

      subtitle: `${mTxt} · ${rTxt}`,

      stats: DATA.global.stats,
      weapons_table: DATA.global.weapons_table,
      map_kings: DATA.global.map_kings,
      timeline: DATA.global.timeline,
      timelineTitle: '📈 Evolución Histórica por Noche'
    };
  }
  const night = DATA.nights[currentTab];
  if (currentMapIdx === -1) {

    const rTxt = plural(night.rounds_count, 'ronda', 'rondas');
    return {
      isGlobal: false,
      isSingleMap: false,
      title: night.title,
      subtitle: `Resumen de la noche (${mTxt} · ${rTxt})`,
      banner: night.winner_banner,

      map_kings: night.map_kings,
      timeline: night.timeline,
      timelineTitle: '📈 Evolución en la Noche (Mapa a Mapa)'
    };
  } else {
    const m = night.maps[currentMapIdx];
    const rTxt = plural(m.rounds_count, 'ronda', 'rondas');
    return {
      isGlobal: false,
      isSingleMap: true,
      title: `Mapa: ${m.map_name} (${m.score})`,
      subtitle: `Duración: ${m.duration} min · ${rTxt} · Finalizado: ${m.end_time}`,
      banner: m.winner_banner,
      stats: m.stats,
      weapons_table: m.weapons_table,
      map_kings: [],
      timeline: []
    };
  }
}

function renderCurrentView() {
  activeCharts.forEach(c => c.destroy());
  activeCharts = [];

  const subBar = document.getElementById('subBar');
  const info = getActiveStatsObj();
  const showBots = document.getElementById('showBotsToggle').checked;

  let mapButtons = '';
  if (currentTab !== 'global') {
    const night = DATA.nights[currentTab];
    mapButtons += `<button class="tab-btn ${currentMapIdx===-1?'active':''}" style="padding:6px 12px;font-size:0.8rem;" onclick="selectMap(-1)">📊 Toda la Noche</button>`;
    night.maps.forEach((m, idx) => {
      mapButtons += `<button class="tab-btn ${currentMapIdx===idx?'active':''}" style="padding:6px 12px;font-size:0.8rem;" onclick="selectMap(${idx})">🗺️ ${m.map_name} (${m.score})</button>`;
    });
  }

  subBar.innerHTML = `
    <div>
      <strong style="font-size:1.15rem;color:#fff;">${info.title}</strong>
      <div style="font-size:0.83rem;color:var(--text-muted);">${info.subtitle}</div>
      ${info.banner ? `<div class="winner-banner">${info.banner}</div>` : ''}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${mapButtons}</div>
  `;

  let rows = info.stats.filter(p => showBots || !p.is_bot);
  if (rows.length === 0) rows = info.stats;

  rows.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });

  // Calcular Habilidades y Torpezas con soporte de empates
  const soloVsAll = getTiedTop(rows, 'solo_vs_all_wins', 1);
  const topIncombustible = info.isGlobal ? getTiedTop(rows, 'rounds_played', 1) : null;
  const regularCandidates = info.isGlobal ? rows.filter(r => r.nights_played >= 2) : [];
  const topRegular = regularCandidates.length ? getTiedMin(regularCandidates, 'rating_stddev', 100) : null;

  const topAdr = getTiedTop(rows, 'adr', 1);
  const topAssist = getTiedTop(rows, 'assists', 1);
  const topHs = getTiedTop(rows, 'headshots', 1);
  const topEntry = getTiedTop(rows, 'first_kills', 1);
  const topPistol = getTiedTop(rows, 'pistol_kills', 1);
  const topFrankotas = getTiedTop(rows, 'awp_kills', 1);
  const topHalcon = getTiedTop(rows, 'max_kill_dist', 1);
  const topUd = getTiedTop(rows, 'engine_ud', 1);
  const topDefuser = getTiedTop(rows, 'bomb_defuses', 1);
  const topKnife = getTiedTop(rows, 'knife_kills', 1);
  const topSuperviviente = getTiedTop(rows, 'rounds_survived', 1);
  const topAmarrategi = getTiedMin(rows, 'spent_per_round');
  const topDerrochador = getTiedTop(rows, 'spent_per_round', 1);

  const topTurista = rows.length > 1 ? getTiedMin(rows, 'rating') : null;

  const topDaltonico = getTiedTop(rows, 'teamkills', 1);
  const topDiana = getTiedTop(rows, 'deaths', 1);
  const topVictim = getTiedTop(rows, 'first_deaths', 1);
  const topMadrugador = getTiedMin(rows, 'fastest_death_sec', 9000);
  const topAtaud = getTiedTop(rows, 'golden_coffin_rounds', 1);

    html += `<div class="award-card skill"><h4>🔥 EL CARNICERO</h4><div class="winner">${topAdr.names}</div><div class="desc">${topAdr.val} daño medio por ronda (${killsInfo})</div></div>`;
  }
  if (topEntry) html += `<div class="award-card skill"><h4>⚡ EL ABRELATAS</h4><div class="winner">${topEntry.names}</div><div class="desc">Mató el primero a un enemigo en ${plural(topEntry.val, 'ronda', 'rondas')}</div></div>`;

  if (topPistol) html += `<div class="award-card skill"><h4>🔫 EL PISTOLERO</h4><div class="winner">${topPistol.names}</div><div class="desc">${plural(topPistol.val, 'baja', 'bajas')} con pistola</div></div>`;

  if (topAssist) html += `<div class="award-card skill"><h4>🤝 EL ASISTENTE</h4><div class="winner">${topAssist.names}</div><div class="desc">${plural(topAssist.val, 'asistencia limpia', 'asistencias limpias')}</div></div>`;
  if (topUd) html += `<div class="award-card skill"><h4>💣 EL GRANADERO</h4><div class="winner">${topUd.names}</div><div class="desc">${topUd.val} de daño con HE y Molotov</div></div>`;
  if (topKnife) html += `<div class="award-card skill"><h4>🔪 EL NAVAJERO</h4><div class="winner">${topKnife.names}</div><div class="desc">${plural(topKnife.val, 'baja a cuchillo', 'bajas a cuchillo')}</div></div>`;
  if (topDefuser) html += `<div class="award-card skill"><h4>✂️ EL DESACTIVADOR</h4><div class="winner">${topDefuser.names}</div><div class="desc">${plural(topDefuser.val, 'bomba desactivada', 'bombas desactivadas')}</div></div>`;
  if (topSuperviviente) html += `<div class="award-card skill"><h4>⛺ EL SUPERVIVIENTE</h4><div class="winner">${topSuperviviente.names}</div><div class="desc">Sobrevivió sin morir en ${plural(topSuperviviente.val, 'ronda', 'rondas')} (${topSuperviviente.sample.surv_pct}%)</div></div>`;
  if (topAmarrategi && topAmarrategi.val >= 0) html += `<div class="award-card skill"><h4>💰 EL AMARRATEGI</h4><div class="winner">${topAmarrategi.names}</div><div class="desc">El que menos gasta: ${topAmarrategi.val}$ por ronda (${topAmarrategi.sample.money_spent}$ total)</div></div>`;

  // Torpezas (Rojas)
  if (topTurista) html += `<div class="award-card blunder"><h4>🏖️ EL TURISTA</h4><div class="winner">${topTurista.names}</div><div class="desc">Pasó por el servidor de vacaciones (${topTurista.val})</div></div>`;
  if (topDesmiembra) html += `<div class="award-card blunder"><h4>🥩 EL DESMIEMBRA CUERPOS</h4><div class="winner">${topDesmiembra.names}</div><div class="desc">No sabe dónde está la cabeza (${topDesmiembra.val}% HS)</div></div>`;
  if (topDiana) html += `<div class="award-card blunder"><h4>🎯 LA DIANA</h4><div class="winner">${topDiana.names}</div><div class="desc">Cayó abatido ${plural(topDiana.val, 'vez', 'veces')}</div></div>`;
  if (topVictim) html += `<div class="award-card blunder"><h4>💀 CARNE DE CAÑÓN</h4><div class="winner">${topVictim.names}</div><div class="desc">Murió el primero en ${plural(topVictim.val, 'ronda', 'rondas')}</div></div>`;
  if (topMadrugador) html += `<div class="award-card blunder"><h4>⏱️ EL MADRUGADOR</h4><div class="winner">${topMadrugador.names}</div><div class="desc">Muerte más rápida: cayó a los ${topMadrugador.val}s de empezar la ronda</div></div>`;

  if (topPierdebombas) html += `<div class="award-card blunder"><h4>📦 EL PIERDEBOMBAS</h4><div class="winner">${topPierdebombas.names}</div><div class="desc">Perdió el C4 ${plural(topPierdebombas.val, 'vez', 'veces')}</div></div>`;
  if (topArtificiero) html += `<div class="award-card blunder"><h4>💥 EL ARTIFICIERO FALLIDO</h4><div class="winner">${topArtificiero.names}</div><div class="desc">Calculó mal la distancia del C4 y voló ${plural(topArtificiero.val, 'vez', 'veces')}</div></div>`;

  if (topChicken) html += `<div class="award-card blunder"><h4>🐔 EL CAZADOR DE POLLOS</h4><div class="winner">${topChicken.names}</div><div class="desc">${plural(topChicken.val, 'gallina asesinada', 'gallinas asesinadas')}</div></div>`;
  html += `</div>`;

  // Rendimiento Competitivo
  html += `<div class="section-title">📊 Rendimiento Competitivo (Estándar + Avanzadas HLTV/FACEIT)</div>`;
  html += `<div class="table-wrap"><table><thead><tr>
    <th onclick="sortBy('name')">Jugador</th>
    <th onclick="sortBy('rating')">Rating 2.0</th>

    <th onclick="sortBy('first_kills')">FK (1ª Baja)</th>
    <th onclick="sortBy('first_deaths')">FD (1ª Muerte)</th>
    <th onclick="sortBy('pistol_kills')">Pistola 🔫</th>
    <th onclick="sortBy('awp_kills')">AWP 🔭</th>
    <th onclick="sortBy('max_kill_dist')">Tiro Lejano 🦅</th>
    <th onclick="sortBy('solo_vs_all_wins')">1 vs Todos</th>
    <th onclick="sortBy('mk_2k')">2K</th>
    <th onclick="sortBy('mk_3k')">3K</th>
    <th onclick="sortBy('mk_4k')">4K</th>
    <th onclick="sortBy('mk_5k')">5K</th>
    <th onclick="sortBy('engine_mvps')">MVPs</th>
    <th onclick="sortBy('fav_weapon')">Arma Favorita</th>
  </tr></thead><tbody>`;

  for (const p of rows) {
    const kdClass = p.kd >= 1.2 ? 'good' : (p.kd < 0.8 ? 'bad' : '');
    const rtClass = p.rating >= 1.15 ? 'good' : (p.rating < 0.85 ? 'bad' : 'highlight');
    html += `<tr>

      <td class="${p.teamkills > 0 ? 'bad' : ''}">${p.teamkills}</td>

  if (info.map_kings && info.map_kings.length > 0) {

    html += `<div class="table-wrap"><table><thead><tr>
      <th>Mapa</th>
      <th>Veces Jugado</th>
      <th>Rondas Totales</th>
      <th>👑 Rey del Mapa (Rating)</th>
      <th>🎯 Máximo Asesino</th>
      <th>🔥 Mayor Carnicero (ADR)</th>
    </tr></thead><tbody>`;
    for (const mk of info.map_kings) {
      html += `<tr>
        <td><b>${mk.map_name}</b></td>
        <td>${mk.times_played}</td>
        <td>${mk.total_rounds}</td>
        <td class="highlight">${mk.king_rating}</td>
        <td class="good">${mk.king_kills}</td>
        <td>${mk.king_adr}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  document.getElementById('contentArea').innerHTML = html;
  if (!info.isSingleMap) {
    buildCharts(info, rows);
  }
}

function buildCharts(info, rows) {
  if (typeof Chart === 'undefined') return;
  Chart.defaults.color = '#cbd5e1';
  Chart.defaults.borderColor = '#263346';

  // 1. Gráfico de Evolución Temporal (Noche a Noche o Mapa a Mapa) con alto contraste
  const tlCanvas = document.getElementById('chartTimeline');
  if (tlCanvas && info.timeline && info.timeline.length > 1) {
    const labels = info.timeline.map(pt => pt.label);
    const humanNames = rows.filter(r => !r.is_bot).map(r => r.name);
    const datasets = humanNames.map((pName) => {
      const col = getPlayerColor(pName);
      return {
        label: pName,
        data: info.timeline.map(pt => pt.players[pName] !== undefined ? pt.players[pName][timelineMetric] : null),
        borderColor: col,
        backgroundColor: col,
        tension: 0.1,
        spanGaps: true,
        borderWidth: 3.5,
        pointRadius: 6,
        pointHoverRadius: 9,
        pointBackgroundColor: col,
        pointBorderColor: '#0f141c',
        pointBorderWidth: 2
      };
    });
    activeCharts.push(new Chart(tlCanvas, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top',
            labels: { color: '#f8fafc', font: { size: 13, weight: '600' }, padding: 16, usePointStyle: true, pointStyle: 'circle' }
          },
          tooltip: {
            backgroundColor: '#0f141cee',
            titleColor: '#f59e0b',
            bodyFont: { size: 13 },
            padding: 12,
            borderColor: '#334155',
            borderWidth: 1
          }
        },
        scales: {
          x: { ticks: { color: '#e2e8f0', font: { weight: '600' } } },
          y: { ticks: { color: '#e2e8f0' }, grid: { color: '#263346' } }
        }
      }
    }));
  }

  // 2. Top 10 Armas
  const wCanvas = document.getElementById('chartWeapons');
  if (wCanvas && info.weapons_table) {
    const topW = info.weapons_table.slice(0, 10);
    activeCharts.push(new Chart(wCanvas, {
      type: 'bar',
      data: {
        labels: topW.map(w => w.weapon),
        datasets: [{
          label: 'Total Bajas',
          data: topW.map(w => w.total),
          backgroundColor: '#f59e0b',
          borderRadius: 5
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { color: '#f1f5f9', font: { weight: '600' } } }
        }
      }
    }));
  }

  // 3. Balance Bajas vs Muertes
  const kdCanvas = document.getElementById('chartKD');
  if (kdCanvas && rows.length > 0) {
    activeCharts.push(new Chart(kdCanvas, {
      type: 'bar',
      data: {
        labels: rows.map(r => r.name),
        datasets: [
          { label: 'Bajas (K)', data: rows.map(r => r.kills), backgroundColor: '#10b981', borderRadius: 4 },
          { label: 'Muertes (D)', data: rows.map(r => r.deaths), backgroundColor: '#ef4444', borderRadius: 4 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#f1f5f9', font: { weight: '600' } } }
        },
        scales: {
          x: { ticks: { color: '#f1f5f9', font: { weight: '600' } } }
        }
      }
    }));
  }
}

init();
</script>
</body>
</html>
